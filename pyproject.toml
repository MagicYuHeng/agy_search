[project]
name = "agy-search"
version = "0.1.0"
description = "Minimal, search-only MCP server wrapping the Antigravity CLI (agy) with a configurable default model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "antigravity", "agy", "search", "gemini"]
dependencies = ["mcp>=2.0.0"]

[project.scripts]
agy-search = "agy_search.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agy_search"]
